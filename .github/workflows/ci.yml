# The gates of §10.3, in order (WP-014). Every job runs Scripts/ci.sh, which is also how the
# gates are run on a developer's machine: what fails here fails there with the same message.
#
# A gate whose input does not exist yet is skipped with a warning annotation, never passed
# silently. Dispatching the workflow by hand with `strict` turns every skip into a failure:
# that is the run a release needs (WP-906).
#
# The gallery's UI tests are not a gate: they take 6 to 14 minutes, so they run nightly
# (`Scripts/ci.sh --nightly`, job gallery-ui-nightly), and on a dispatch that asks for them. The
# nightly run is that job alone; the gates run on pushes, pull requests and dispatches.
#
# Repository variables:
#   ZTD_RUNNER             the label of the macOS runner (default: macos-latest)
#   ZTD_XCODE              the path of the Xcode to use (default: /Applications/Xcode_27.0.app)
#   ZTD_BENCHMARK_RUNNER   `true` when a self-hosted runner labelled `ztrondsp-benchmark` exists;
#                          benchmarks are only comparable on one pinned machine (gate 8)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: A skipped gate fails the run (the release check)
        type: boolean
        default: false
      gallery_ui:
        description: Also run the gallery's UI tests (the nightly job, not a gate)
        type: boolean
        default: false
  schedule:
    # The nightly job: the gallery's UI tests (02:30 UTC).
    - cron: '30 2 * * *'

concurrency:
  # The nightly run has a group of its own: it neither cancels a run of the gates nor is cancelled by one.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: ${{ vars.ZTD_XCODE || '/Applications/Xcode_27.0.app' }}/Contents/Developer
  ZTD_CI_STRICT: ${{ (github.event_name == 'workflow_dispatch' && inputs.strict) && '--strict' || '' }}

jobs:
  gates-1-4:
    name: Gates 1–4 · build, lint, compile fixtures, API digest and documentation
    # Every job of the gates waits for this one: the nightly run skips them all here.
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: The self-tests of the gates
        run: Scripts/tests/run-all.sh
      - name: Gate 1 · build for simulator and device, warnings as errors in production targets; the gallery application in Release
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 1
      - name: Gate 2 · lint-bans, all four parts, and the dependency graph
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 2
      - name: Gate 3 · compile fixtures and the order matrix
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 3
      - name: Gate 4 · API digest, and every public symbol documented with its threading contract
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 4

  gate-5-tests:
    name: Gate 5 · tests on ${{ matrix.runtime }}
    needs: gates-1-4
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # PLAT-3: the oldest runtime that runs on the current host, then the newest of each
        # major version. iOS 15 and 16 cannot be simulated (E-17): the device run covers them.
        runtime: [iOS-17-5, iOS-18-6, iOS-26-5, iOS-27-0]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate 5 · tests in Debug and the gallery's hosted suites (no known issue); the allocation-audit tests once more in Release
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 5 --runtime com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}
      - name: Gate 6 · coverage, from the run on the newest runtime
        if: matrix.runtime == 'iOS-27-0'
        env:
          ZTD_CI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 6
      - name: Keep the result bundle of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runtime }}
          path: .build/ci-results
          if-no-files-found: ignore

  gate-5-thread-sanitizer:
    name: Gate 5 · Thread Sanitizer
    needs: gates-1-4
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Gate 5 · tests under the Thread Sanitizer
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 5 --tsan-only

  gate-7-golden:
    name: Gate 7 · golden vectors
    needs: [gate-5-tests, gate-5-thread-sanitizer]
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The generator environment: GNU Octave runs every golden MATLAB script in gate 7 (WP-910),
      # and the pinned oracles reproduce the vectors in the step after it.
      - name: GNU Octave, for the golden MATLAB scripts
        run: brew install octave
      - name: Gate 7 · the vectors against their manifest; the golden MATLAB scripts under GNU Octave
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 7
      - name: The pinned oracles reproduce the vectors
        run: |
          python3 -m pip install --quiet -r Tests/Golden/generators/requirements.txt
          Scripts/golden.sh --reproduce

  gate-8-benchmarks:
    name: Gate 8 · benchmark regression check
    needs: gate-7-golden
    if: vars.ZTD_BENCHMARK_RUNNER == 'true'
    # The pinned runner: timings are compared with baselines that were measured on this machine.
    runs-on: [self-hosted, macOS, ARM64, ztrondsp-benchmark]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Gate 8 · benchmarks against their committed baselines
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 8

  gate-8-not-pinned:
    name: Gate 8 · no pinned runner
    needs: gate-7-golden
    if: vars.ZTD_BENCHMARK_RUNNER != 'true'
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    steps:
      - name: Gate 8 was not run
        run: |
          echo "::warning title=CI gate 8 (benchmarks) skipped::No pinned benchmark runner is configured (repository variable ZTD_BENCHMARK_RUNNER)."
          if [ -n "$ZTD_CI_STRICT" ]; then echo "A strict run needs gate 8." ; exit 1; fi

  gate-9-external-parity:
    name: Gate 9 · external parity suite
    needs: [gate-8-benchmarks, gate-8-not-pinned]
    # One of the two jobs of gate 8 is always skipped; run when neither failed (and not in the
    # nightly run, which skips the gates).
    if: ${{ github.event_name != 'schedule' && !failure() && !cancelled() }}
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Gate 9 · a package outside this one against the stock stages (EXT-4), the promises kept
        run: Scripts/ci.sh $ZTD_CI_STRICT --gate 9

  gallery-ui-nightly:
    name: Nightly · the gallery's UI tests on ${{ matrix.runtime }} (not a gate)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.gallery_ui)
    runs-on: ${{ vars.ZTD_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The runtimes of gate 5 (PLAT-3).
        runtime: [iOS-17-5, iOS-18-6, iOS-26-5, iOS-27-0]
    steps:
      - uses: actions/checkout@v4
      - name: The gallery's UI tests (GalleryUITests, 6 to 14 minutes)
        run: Scripts/ci.sh --nightly --runtime com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}
      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ui-${{ matrix.runtime }}
          path: .build/ci-gallery/last-*.log
          if-no-files-found: ignore
